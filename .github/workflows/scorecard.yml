# OpenSSF Scorecard: checks the repository's supply-chain practices (pinned actions, branch protection,
# token permissions…). Those are repository settings rather than code, so it runs weekly, when branch
# protection changes, or by hand, not on every push. Results go to this repository's code-scanning tab
# only (publish_results: false).
name: Scorecard

on:
  branch_protection_rule:
  schedule:
    - cron: "41 5 * * 1"
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: false
      - uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: results.sarif

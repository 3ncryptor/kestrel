# OpenSSF Scorecard: checks the repository's supply-chain practices (pinned actions, branch protection,
# token permissions…). Those are repository settings rather than code, so it runs weekly, when branch
# protection changes, or by hand, not on every push. Results go to this repository's code-scanning tab
# only (publish_results: false).
name: Scorecard

on:
  branch_protection_rule:
  schedule:
    - cron: "41 5 * * 1"
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: false
      - uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: results.sarif

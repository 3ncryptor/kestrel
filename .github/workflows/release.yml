# Releases Kestrel (see RELEASING.md). A v*.*.* tag on main runs every stage; publishing waits for a
# maintainer to approve the `release` environment:
#   verify     the tag matches package.json, CHANGELOG.md has the section, lint/types/tests pass
#   build      the standalone binary on each of the four targets (built and smoke-tested natively)
#   assemble   release archives + SHA256SUMS + install.sh, and the five npm tarballs
#   rehearse   on every target: install.sh from a local server, and the npm packages published to a
#              throwaway local registry and installed from it, the exact files that get published
#   publish    (approval) build provenance, a draft GitHub Release, npm with provenance, then the
#              release goes live
#   live       fresh machines install the published release through curl | sh and npm
# Run it by hand (Actions → Release → Run workflow) for a rehearsal: everything up to publish, which is
# skipped. Only a tag push can publish.
name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  BUN_VERSION: 1.4.0
  # Trusted publishing needs npm 11.5.1 or newer, which Node 24 ships with.
  NODE_VERSION: 24

jobs:
  verify:
    name: Verify the release
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - id: meta
        name: Version, tag and release notes
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version=$(node -p 'require("./package.json").version')
          if [ "$EVENT" = push ]; then
            tag=$REF_NAME
            # Only a commit that is on main can be released.
            git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::$tag is not on main"; exit 1; }
          else
            tag="v$version"
          fi
          node scripts/release-notes.js "$tag" > release-notes.md
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          { echo "### $tag ($EVENT)"; echo; cat release-notes.md; } >> "$GITHUB_STEP_SUMMARY"
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: npm test
      - run: bun run test:bun
      - run: bun run test:ui
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error

  build:
    name: Binary (${{ matrix.target }})
    needs: verify
    strategy:
      matrix:
        include:
          - { target: darwin-arm64, os: macos-15 }
          - { target: darwin-x64, os: macos-15-intel }
          - { target: linux-x64, os: ubuntu-24.04 }
          - { target: linux-arm64, os: ubuntu-24.04-arm }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - name: Compile, smoke-test and archive
        run: bun scripts/build.js --archive
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binary-${{ matrix.target }}
          # The raw binary goes into the npm package, the archive into the GitHub Release.
          path: |
            dist/kestrel-${{ matrix.target }}
            dist/*.tar.gz
          if-no-files-found: error

  assemble:
    name: Assemble the release files
    needs: [verify, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: binary-*
          path: binaries
          merge-multiple: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-notes
          path: release
      - name: Archives, SHA256SUMS and the installer
        run: |
          mv binaries/*.tar.gz release/
          cp packaging/install.sh release/
          (cd release && sha256sum kestrel-v*.tar.gz > SHA256SUMS && cat SHA256SUMS)
          test "$(wc -l < release/SHA256SUMS)" -eq 4
      - name: npm packages
        run: |
          node scripts/npm-packages.js binaries npm-src
          mkdir -p release/npm
          for pkg in npm-src/*; do npm pack "./$pkg" --pack-destination release/npm; done  # ./ or npm reads owner/repo as GitHub
          ls -l release/npm
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release
          path: release
          if-no-files-found: error

  rehearse:
    name: Rehearse the installs (${{ matrix.os }})
    needs: [verify, assemble]
    strategy:
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release
          path: release
      - name: curl | sh, from a local copy of the release
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 --directory release > /dev/null 2>&1 &
          until curl -fsS -o /dev/null http://127.0.0.1:8765/SHA256SUMS; do sleep 0.2; done
          KESTREL_DOWNLOAD_BASE=http://127.0.0.1:8765 KESTREL_VERSION="v$VERSION" KESTREL_INSTALL_DIR="$RUNNER_TEMP/bin" sh release/install.sh
          test "$("$RUNNER_TEMP/bin/kestrel" --version)" = "kestrel $VERSION"
          "$RUNNER_TEMP/bin/kestrel" sm --dump --ticks 1 > /dev/null
      - name: npm, through a throwaway local registry
        run: sh scripts/npm-rehearse.sh release/npm

  publish:
    name: Publish ${{ needs.verify.outputs.tag }}
    needs: [verify, rehearse]
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: release
      url: https://github.com/${{ github.repository }}/releases/tag/${{ needs.verify.outputs.tag }}
    permissions:
      contents: write     # the GitHub Release
      id-token: write     # npm provenance and trusted publishing, build attestations
      attestations: write
    env:
      TAG: ${{ needs.verify.outputs.tag }}
      VERSION: ${{ needs.verify.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release
          path: release
      - name: Build provenance for the archives
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: release/SHA256SUMS
      - name: Draft GitHub Release (re-runs replace its files)
        run: |
          set -- release/kestrel-v*.tar.gz release/SHA256SUMS release/install.sh
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "$@" --clobber
          else
            gh release create "$TAG" "$@" --draft --verify-tag --title "Kestrel $VERSION" --notes-file release/release-notes.md
          fi
      - name: npm (platform packages first, then kestrel-tui; skips what is already published)
        env:
          # The one-day bootstrap token for the first release, stored as a secret of the `release`
          # environment. Once trusted publishing is set up (scripts/npm-trust.sh) the secret is
          # deleted and npm authenticates through OIDC instead.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
        run: |
          npm --version
          sh scripts/npm-publish.sh release/npm
      - name: Make the GitHub Release live
        run: gh release edit "$TAG" --draft=false --latest

  live:
    name: Install the published release (${{ matrix.os }})
    needs: [verify, publish]
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      TAG: ${{ needs.verify.outputs.tag }}
      VERSION: ${{ needs.verify.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: curl | sh from GitHub
        run: |
          curl -fsSL "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$TAG/packaging/install.sh" \
            | KESTREL_VERSION="$TAG" KESTREL_INSTALL_DIR="$RUNNER_TEMP/bin" sh
          test "$("$RUNNER_TEMP/bin/kestrel" --version)" = "kestrel $VERSION"
      - name: The archive's build provenance verifies
        run: |
          target="$(uname -s | tr '[:upper:]' '[:lower:]')-$(uname -m | sed 's/x86_64/x64/; s/aarch64/arm64/')"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "kestrel-$TAG-$target.tar.gz"
          gh attestation verify "kestrel-$TAG-$target.tar.gz" --repo "$GITHUB_REPOSITORY"
      - name: npm install -g kestrel-tui (waits for the registry to catch up)
        run: |
          for _ in $(seq 1 30); do npm view "kestrel-tui@$VERSION" version > /dev/null 2>&1 && break; sleep 10; done
          npm install -g "kestrel-tui@$VERSION"
          test "$(kestrel --version)" = "kestrel $VERSION"
          kestrel sm --dump --ticks 1 > /dev/null
      - name: npm signatures and provenance verify
        run: |
          mkdir -p "$RUNNER_TEMP/audit" && cd "$RUNNER_TEMP/audit"
          npm init -y > /dev/null
          npm install "kestrel-tui@$VERSION"
          npm audit signatures
